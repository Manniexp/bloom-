<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bloom | Feed</title>

    <link rel="stylesheet" href="feed.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>


<body>


<!-- Bloom Header -->

<header class="header">

    <a href="dashboard.html" class="home-logo">

        <img
            src="https://www.image2url.com/r2/default/images/1792295113555-4f1f8295-fd7d-4ae6-a773-64bc879cab3f.png"
            alt="Bloom Logo"
            class="logo">

        <span>Bloom</span>

    </a>


    <!-- Navigation -->

    <nav class="navigation">

        <a href="dashboard.html">
            Home
        </a>

        <a href="feed.html">
            Bloom
        </a>

        <a href="create.html">
            Create
        </a>

        <a href="profile.html">
            Profile
        </a>

    </nav>

</header>



<!-- Feed -->

<main class="feed-page">


    <!-- Create Post -->

    <section class="create-post">


        // Blooming Title Wave
        <h1 class="blooming-title-wave">
            <span>W</span><span>h</span><span>a</span><span>t</span><span>'</span><span>s</span>
            &nbsp;
            <span>b</span><span>l</span><span>o</span><span>o</span><span>m</span><span>i</span><span>n</span><span>g</span><span>?</span>
            <span class="blooming-emoji">🌸</span>
        </h1>

        <button id="create-post-button">
             Create a Post
        </button>

    </section>



    <!-- Feed Posts -->

    <section class="feed">

        <div id="posts-container">

            <!-- Posts will appear here -->

        </div>

    </section>


</main>



<script type="module" src="feed.js"></script>

</body>

</html>
