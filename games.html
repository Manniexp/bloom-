<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Games | Bloom</title>

    <link rel="stylesheet" href="games.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>


<body>


<!--  Bloom Header -->

<header class="header">

    <a href="dashboard.html" class="home-logo">

        <img
        src="https://www.image2url.com/r2/default/images/1792295113555-4f1f8295-fd7d-4ae6-a773-64bc879cab3f.png"
        class="logo"
        alt="Bloom Logo">

        <span>Bloom</span>

    </a>

</header>



<!-- Games Hero -->

<section class="games-hero">

    <h1> 🎮 Create Games</h1>

    <p>
        Build worlds players will love.
    </p>

</section>



<!--  Game Creator -->

<section class="games-container">


    <!--  Game Download Link Input -->

    <input
    type="url"
    id="game-file-url"
    class="games-input"
    placeholder="Game Download Link (Google Drive, Itch.io, GitHub, etc.)">



    <!-- Game Title -->

    <input
    type="text"
    id="game-title"
    class="games-input"
    placeholder="Game Title">



    <!-- Genre -->

    <input
    type="text"
    id="game-genre"
    class="games-input"
    placeholder="Genre">



    <!--  Game Engine -->

    <input
    type="text"
    id="game-engine"
    class="games-input"
    placeholder="Game Engine">



    <!--  Description -->

    <textarea
    id="game-description"
    class="games-description"
    placeholder="Tell us about your game..."></textarea>



    <!--  Save -->

    <button
    id="save-game-button"
    type="button"
    class="save-button">

        Save Game 🌸

    </button>


</section>



<script type="module" src="games.js"></script>

</body>

</html>
