<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Projects | Bloom</title>

    <link rel="stylesheet" href="projects.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>


<body>


<!-- 🌸 Bloom Header -->

<header class="header">

    <a href="dashboard.html" class="home-logo">

        <img
        src="https://www.image2url.com/r2/default/images/1792295113555-4f1f8295-fd7d-4ae6-a773-64bc879cab3f.png"
        class="logo"
        alt="Bloom Logo">

        <span>Bloom</span>

    </a>

</header>



<!-- 💡 Projects Hero -->

<section class="projects-hero">

    <h1>💡 Create Projects</h1>

    <p>
        Turn your ideas into something amazing.
    </p>

</section>



<!-- 💡 Project Creator -->

<section class="projects-container">


    <!-- 🌸 Upload Card -->

    <div class="project-upload-card">


        <!-- 📁 Project Upload Box -->

        <div class="upload-box">

            <h2>💡</h2>

            <p>
                Upload your project
            </p>

            <input
            type="file"
            id="project-upload"
            accept=".zip,.pdf,.doc,.docx,.ppt,.pptx">

        </div>


    </div>



    <!-- 💡 Project Title -->

    <input
    type="text"
    id="project-title"
    class="projects-input"
    placeholder="Project Title">



    <!-- 🏷️ Project Type -->

    <input
    type="text"
    id="project-type"
    class="projects-input"
    placeholder="Project Type">



    <!-- 🛠️ Tools -->

    <input
    type="text"
    id="project-tools"
    class="projects-input"
    placeholder="Tools Used (e.g., Photoshop, Unity, etc.)">



    <!-- 📝 Description -->

    <textarea
    id="project-description"
    class="projects-description"
    placeholder="Tell us about your project..."></textarea>



    <!-- 🌸 Save -->

    <button
    id="save-project-button"
    class="save-button">

        Save Project 🌸

    </button>


</section>



<script type="module" src="projects.js"></script>

</body>

</html>
