<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Writing | Bloom</title>

    <link rel="stylesheet" href="writing.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!--  Bloom Logo -->

    <header class="header">

        <a href="dashboard.html" class="home-logo">

            <img
                src="https://www.image2url.com/r2/default/images/1792295113555-4f1f8295-fd7d-4ae6-a773-64bc879cab3f.png"
                class="logo"
                alt="Bloom Logo">

            <span>Bloom</span>

        </a>

    </header>


    <!-- Writing Creator -->

    <section class="writing-hero">

        <h1> Create Writing </h1>

        <p>
            Let your story blossom
        </p>

    </section>


    <section class="writing-area">

        <input
            type="text"
            id="writing-title"
            class="writing-input"
            placeholder="Story Title">

        <input
            type="text"
            id="writing-genre"
            class="writing-input"
            placeholder="Genre (Fantasy, Romance, Fiction, YA, Poetry )">

        <textarea
            id="writing-description"
            class="writing-textarea"
            placeholder="Your story..."></textarea>

        <button id="save-writing-button" class="save-button">
            Save Story 🌸
        </button>

    </section>

    <script type="module" src="writing.js"></script>

</body>

</html>
